<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1630">
<title>Lesson 1: Rumbo Rises - Adding</title>
<style>:root{--navy:#0b1630;--cream:#fffaf0;--orange:#ff8a1f;--orange-d:#c85f00;--teal:#12a594;--teal-d:#0b7a6d;--green:#3fa564;--red:#e5484d;--gold:#ffc83d;--ink:#1d2433;--soft:#eef3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:"Trebuchet MS",Verdana,system-ui,sans-serif;color:var(--ink);background:#0b1630 radial-gradient(ellipse at 85% -10%,#34569f 0,#0b1630 62%) fixed;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(11,22,48,.94);color:#fff}
.top .home{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);text-decoration:none;font-size:22px;flex:none}
.top .ttl{font-weight:bold;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.pbar{flex:1;min-width:40px;height:14px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--orange));border-radius:9px;transition:width .5s}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:20px;padding:5px 12px 5px 8px;font-weight:bold;white-space:nowrap;font-size:18px}
.chip svg{width:26px;height:26px}
.tbtn{width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;flex:none}
.tbtn.off{opacity:.4}

#stage,.wrap{max-width:960px;margin:0 auto;padding:14px 14px 70px}
.card{background:var(--cream);border-radius:26px;padding:18px;box-shadow:0 10px 0 rgba(0,0,0,.25),0 20px 40px rgba(0,0,0,.35);animation:rise .4s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:.2em 0}
.title{font-size:clamp(28px,5vw,44px);color:#13306b;text-align:center}
.sub{text-align:center;font-size:clamp(18px,2.6vw,24px);line-height:1.5}
.prompt{font-size:clamp(21px,3.2vw,30px);line-height:1.55;margin:10px 4px}
.prompt .w{border-radius:6px;padding:0 1px;transition:background .15s}
.prompt .w.hl{background:#ffd95e}
.prompt .w:active{background:#ffe9a3}
.center{text-align:center}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin:12px 0}

/* buttons */
.btn{border:0;border-radius:18px;padding:14px 26px;font-size:clamp(20px,3vw,26px);font-weight:bold;color:#fff;background:var(--orange);box-shadow:0 6px 0 var(--orange-d);min-height:62px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--orange-d)}
.btn.alt{background:var(--teal);box-shadow:0 6px 0 var(--teal-d)}
.btn.alt:active{box-shadow:0 2px 0 var(--teal-d)}
.btn.ghost{background:#dfe7fb;color:#26407a;box-shadow:0 6px 0 #b4c2ea}
.btn.ghost:active{box-shadow:0 2px 0 #b4c2ea}
.btn[disabled]{opacity:.45}
.btn.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* scene + characters */
.scene{position:relative;height:clamp(180px,27vw,255px);border-radius:20px;overflow:hidden;margin-bottom:12px;background:#14305f}
.scene.mini{height:clamp(120px,17vw,175px)}
.scene .bg{position:absolute;inset:0}
.scene .bg svg{width:100%;height:100%;display:block}
.wave{animation:wave 4s linear infinite}
.wave.w2{animation-duration:6s;animation-direction:reverse}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-100px)}}
.twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.bolt{animation:bolt 4s infinite}
@keyframes bolt{0%,88%,100%{opacity:0}90%,96%{opacity:1}93%{opacity:.2}}
.scene.stormy::before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(105deg,rgba(255,255,255,.0) 0 14px,rgba(210,225,255,.35) 14px 15px);background-size:60px 60px;animation:rain .35s linear infinite}
@keyframes rain{from{background-position:0 0}to{background-position:-18px 60px}}

.actor{position:absolute;bottom:3%;transform-origin:50% 100%;cursor:pointer;z-index:2}
.actor svg{height:100%;width:auto;display:block;overflow:visible}
.actor.flip svg{transform:scaleX(-1)}
.solo{display:inline-block}
.solo svg{height:100%;width:auto;display:block;overflow:visible}
.a-bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
.a-stomp{animation:stomp 1.2s ease-in-out infinite}
@keyframes stomp{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-5%) rotate(-2deg)}50%{transform:translateY(0)}75%{transform:translateY(-5%) rotate(2deg)}}
.a-hop{animation:hop .8s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-16%)}}
.a-rise{animation:rise2 2.6s ease-out both}
@keyframes rise2{from{transform:translateY(105%)}to{transform:translateY(0)}}
.a-still{animation:none}
.actor.poked{animation:poked .6s ease}
@keyframes poked{0%{transform:scale(1)}30%{transform:scale(1.12) rotate(-3deg)}60%{transform:scale(.96) rotate(2deg)}100%{transform:scale(1)}}
.tail{transform-box:fill-box;transform-origin:92% 40%;animation:wag 1.6s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.orb{fill:#ffb347;filter:drop-shadow(0 0 5px #ff9a1f);animation:glow 1.8s ease-in-out infinite}
.orb.o2{animation-delay:.4s}.orb.o3{animation-delay:.8s}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
.roaring .head{transform-box:fill-box;transform-origin:50% 90%;animation:roarhead .9s ease}
@keyframes roarhead{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.1) rotate(-6deg)}60%{transform:scale(1.08) rotate(-4deg)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translate(0)}15%{transform:translate(-6px,3px)}30%{transform:translate(6px,-3px)}45%{transform:translate(-5px,-2px)}60%{transform:translate(5px,3px)}80%{transform:translate(-2px,1px)}}

/* old black & white monster-movie look */
.scene.film .bg,.scene.film .actor{filter:grayscale(1) contrast(1.15) brightness(.95)}
.scene.film .grain{position:absolute;inset:0;z-index:6;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,rgba(0,0,0,.05) 1px 3px);animation:flick .18s steps(2) infinite}
@keyframes flick{0%{opacity:.9}50%{opacity:1}100%{opacity:.85}}

/* page dots */
.dots{display:flex;gap:8px;justify-content:center;margin:6px 0}
.dots i{width:12px;height:12px;border-radius:50%;background:#c9d4f2}
.dots i.on{background:var(--orange)}

/* vocab cards */
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:12px 0}
.vcard{border:4px solid #cfd8f1;background:#fff;border-radius:22px;padding:14px;min-height:140px;box-shadow:0 6px 0 #b7c2e6;text-align:center;color:var(--ink)}
.vcard .vw{font-size:clamp(28px,4.4vw,38px);font-weight:bold;color:#13306b}
.vcard .vm{display:none;font-size:clamp(18px,2.6vw,22px);line-height:1.4;margin-top:6px}
.vcard.open{background:#fff4cf;border-color:var(--gold)}
.vcard.open .vm{display:block}
.vcard .vh{font-size:15px;color:#6b7aa6;margin-top:6px}
.vcard.open .vh{display:none}

/* groups of items */
.groups{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:10px 0}
.group{background:var(--soft);border-radius:20px;padding:10px 12px;min-width:150px;text-align:center}
.group .gl{font-weight:bold;color:#26407a;font-size:18px;margin-bottom:4px}
.items{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.sign{font-size:48px;font-weight:bold;color:var(--orange-d)}
.it{width:clamp(52px,9vw,70px);height:clamp(58px,10vw,78px);border:3px dashed transparent;background:transparent;padding:2px;border-radius:14px;transition:transform .15s,background .15s}
.it svg{width:100%;height:100%;display:block}
.it.on{background:#fff2c2;border-color:var(--gold);transform:scale(1.1)}
.it.gone{transform:scale(0);opacity:0;pointer-events:none;transition:transform .35s,opacity .35s}
.it.gone.keep{transform:none;opacity:.2}
.it.xed{opacity:.35;position:relative}
.it.xed::after{content:"\2715";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:46px;color:var(--red);font-weight:bold}
.counter{text-align:center;font-size:clamp(20px,3vw,26px);margin:8px 0}
.counter b{display:inline-block;min-width:56px;font-size:46px;color:var(--orange-d);vertical-align:middle}
.eq{text-align:center;font-size:clamp(38px,7vw,62px);font-weight:bold;color:#13306b;margin:6px 0}
.eq .slot{display:inline-block;min-width:1.2em;border-bottom:6px solid var(--orange);color:var(--orange-d)}
.eq.good .slot{color:var(--green);border-color:var(--green);animation:pulse .6s}

/* options */
.opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.opt{min-width:112px;min-height:88px;padding:6px 22px;font-size:40px;font-weight:bold;color:#13306b;background:#fff;border:4px solid #cfd8f1;border-radius:22px;box-shadow:0 6px 0 #b7c2e6}
.opt.txt{font-size:clamp(24px,4vw,32px)}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 #b7c2e6}
.opt.good{background:#d7f5df;border-color:var(--green);box-shadow:0 6px 0 #8bcf9f}
.opt.bad{background:#fde1e1;border-color:var(--red);box-shadow:0 6px 0 #e9a4a6;animation:shake .4s}
.fb{min-height:34px;text-align:center;font-size:clamp(19px,2.8vw,24px);font-weight:bold;margin:4px 0}
.fb.good{color:#1f7a3f}.fb.bad{color:#b3262b}

/* number line */
.nl{position:relative;margin:6px 0 14px;padding-top:92px}
.hopper{position:absolute;top:90px;width:0;height:0;transition:left .45s cubic-bezier(.3,1.3,.5,1)}
.hopper .hj{position:absolute;left:0;bottom:2px;transform:translateX(-50%);height:84px}
.hopper .hj.j{animation:hj .45s}
.hopper svg{height:84px;width:auto;display:block}
@keyframes hj{0%,100%{margin-bottom:0}50%{margin-bottom:34px}}
.cells{display:flex}
.cell{flex:1;text-align:center;font-size:clamp(16px,3.2vw,28px);font-weight:bold;padding:12px 0;background:#fff;border:3px solid #c9d4f2;margin-right:-3px;color:#13306b}
.cell.start{background:#d7f5df}
.cell.vis{background:#fff2c2}
.cell.here{background:var(--orange);color:#fff}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:#26407a;font-size:20px}
.qpic{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.qpic .grp{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;max-width:46%}
.qpic .it{width:46px;height:52px;cursor:default;pointer-events:none}
.qpic .sign{font-size:38px}

/* finish */
.stars{display:flex;justify-content:center;gap:10px;margin:8px 0}
.stars span{width:clamp(70px,16vw,110px);display:block;animation:starpop .6s ease both}
.stars span svg{width:100%;height:auto;display:block}
.stars span:nth-child(2){animation-delay:.35s}.stars span:nth-child(3){animation-delay:.7s}
@keyframes starpop{0%{transform:scale(0) rotate(-120deg)}70%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
.earn{display:flex;align-items:center;justify-content:center;gap:10px;font-size:clamp(24px,4vw,34px);font-weight:bold;color:#13306b;margin:6px 0}
.earn svg{width:48px;height:48px}
.rain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.rain i{position:absolute;top:-60px;width:44px;height:44px;animation:fall linear forwards}
.rain i svg{width:100%;height:100%}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}

/* home */
.hero{position:relative}
.hero .htitle{position:absolute;left:0;right:0;top:10px;text-align:center;z-index:7;color:#fff;font-size:clamp(26px,5.4vw,50px);font-weight:bold;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 18px rgba(0,0,0,.5);padding:0 10px;line-height:1.15}
.hero .hsub{position:absolute;left:0;right:0;top:calc(10px + clamp(34px,7vw,64px));text-align:center;z-index:7;color:#ffe9a3;font-size:clamp(15px,2.4vw,22px);text-shadow:0 2px 0 rgba(0,0,0,.5)}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin:16px 0}
.lcard{display:block;text-decoration:none;color:var(--ink);background:var(--cream);border-radius:24px;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.25);position:relative}
.lcard:active{transform:translateY(3px)}
.lcard .lnum{display:inline-block;background:var(--orange);color:#fff;border-radius:14px;padding:2px 12px;font-weight:bold;font-size:15px}
.lcard h3{font-size:24px;color:#13306b;margin:8px 0 4px}
.lcard p{margin:0 0 8px;font-size:17px;line-height:1.4}
.lcard .lst{display:flex;gap:4px;align-items:center}
.lcard .lst svg{width:30px;height:30px}
.lcard .go{position:absolute;right:14px;bottom:14px}
.lcard.soon{opacity:.6;pointer-events:none;background:#d9e1f5}
.lcard .lthumb{display:flex;gap:6px;height:56px;margin-bottom:6px}
.section{color:#fff;font-size:24px;margin:22px 4px 6px}
.friends{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.friend{width:min(30%,200px);background:var(--cream);border-radius:22px;padding:10px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.friend .solo{height:96px}
.friend.locked .solo{filter:brightness(0) opacity(.35)}
.friend b{display:block;font-size:16px;color:#13306b;margin-top:4px}
.friend small{display:block;color:#6b7aa6;font-size:13px}
.grown{background:rgba(255,255,255,.08);border-radius:18px;padding:10px 16px;color:#dfe7fb;margin-top:26px}
.grown summary{cursor:pointer;font-weight:bold;font-size:17px;padding:6px 0}
.grown table{width:100%;border-collapse:collapse;margin:10px 0;font-size:16px}
.grown th,.grown td{text-align:left;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.15)}
.grown .btn{min-height:46px;font-size:16px;padding:8px 16px}
@media (max-width:560px){.top .ttl{display:none}.chip{font-size:16px;padding:4px 9px 4px 6px}.sign{font-size:36px}}
</style></head><body>
<header class="top">
<a class="home" href="index.html" aria-label="Home">&#127968;</a>
<div class="ttl" id="lessonTitle"></div>
<div class="pbar"><i id="pbar"></i></div>
<div class="chip" id="chipStars"></div><div class="chip" id="chipCoins"></div>
<button class="tbtn" id="btnAuto" title="Read everything to me automatically">&#128483;</button>
<button class="tbtn" id="btnSound" title="Sound on/off">&#128266;</button>
</header>
<main id="stage"></main>
<script>/* Jayven's Kaiju & Dino Academy - shared core: progress, sound, speech, art */
(function () {
  'use strict';
  var W = window;
  var KEY = 'jayven_progress_v1';

  /* ---------- progress store (localStorage + window.name backup) ---------- */
  function blank() { return { lessons: {}, settings: { sound: true, autoread: false } }; }
  function merge(a, b) {
    var out = blank();
    [a, b].forEach(function (x) {
      if (!x || typeof x !== 'object') return;
      if (x.settings) { for (var k in x.settings) { out.settings[k] = x.settings[k]; } }
      if (x.lessons) {
        for (var id in x.lessons) {
          var n = x.lessons[id], o = out.lessons[id];
          if (!o) { out.lessons[id] = JSON.parse(JSON.stringify(n)); }
          else {
            o.stars = Math.max(o.stars || 0, n.stars || 0);
            o.bestScore = Math.max(o.bestScore || 0, n.bestScore || 0);
            o.bestCoins = Math.max(o.bestCoins || 0, n.bestCoins || 0);
            o.plays = Math.max(o.plays || 0, n.plays || 0);
            o.total = n.total || o.total;
          }
        }
      }
    });
    return out;
  }
  function load() {
    var s = null, w = null;
    try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    try { if (String(W.name).indexOf('JAYVEN:') === 0) { w = JSON.parse(String(W.name).slice(7)); } } catch (e) {}
    return merge(s, w);
  }
  var store = load();
  function save() {
    var j = JSON.stringify(store);
    try { localStorage.setItem(KEY, j); } catch (e) {}
    try { W.name = 'JAYVEN:' + j; } catch (e) {}
  }
  function reset() { store.lessons = {}; save(); }
  function totals() {
    var stars = 0, coins = 0, done = 0;
    for (var id in store.lessons) {
      var l = store.lessons[id];
      stars += l.stars || 0; coins += l.bestCoins || 0; if ((l.stars || 0) > 0) { done++; }
    }
    return { stars: stars, coins: coins, done: done };
  }

  /* ---------- sound effects (synthesised, no files needed) ---------- */
  var AC = null;
  function ctx() {
    if (!AC) {
      var C = W.AudioContext || W.webkitAudioContext;
      if (C) { try { AC = new C(); } catch (e) {} }
    }
    if (AC && AC.state === 'suspended') { try { AC.resume(); } catch (e) {} }
    return AC;
  }
  function tone(f, d, type, vol, slide, delay) {
    if (!store.settings.sound) { return; }
    var c = ctx(); if (!c) { return; }
    var t = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (slide) { o.frequency.exponentialRampToValueAtTime(Math.max(1, slide), t + d); }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.05);
  }
  function noise(d, vol, fc, delay) {
    if (!store.settings.sound) { return; }
    var c = ctx(); if (!c) { return; }
    var t = c.currentTime + (delay || 0);
    var n = Math.floor(c.sampleRate * d);
    var buf = c.createBuffer(1, n, c.sampleRate), data = buf.getChannelData(0);
    for (var i = 0; i < n; i++) { data[i] = (Math.random() * 2 - 1) * (1 - i / n); }
    var s = c.createBufferSource(); s.buffer = buf;
    var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fc || 600;
    var g = c.createGain(); g.gain.value = vol || 0.3;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
  }
  var sfx = {
    tap: function () { tone(520, 0.08, 'triangle', 0.15, 700); },
    pop: function (n) { tone(380 + (n || 0) * 55, 0.14, 'sine', 0.22, 600 + (n || 0) * 70); },
    ok: function () { tone(523, 0.14, 'triangle', 0.22); tone(659, 0.14, 'triangle', 0.22, 0, 0.12); tone(784, 0.24, 'triangle', 0.22, 0, 0.24); },
    no: function () { tone(220, 0.25, 'sawtooth', 0.1, 150); },
    hop: function () { tone(300, 0.15, 'square', 0.08, 640); },
    coin: function () { tone(988, 0.08, 'square', 0.08); tone(1319, 0.25, 'square', 0.08, 0, 0.08); },
    stomp: function () { tone(90, 0.35, 'sine', 0.5, 35); noise(0.3, 0.5, 300); },
    roar: function () { tone(110, 0.9, 'sawtooth', 0.26, 50); tone(165, 0.9, 'square', 0.08, 70); noise(0.9, 0.35, 900); },
    chirp: function () { tone(900, 0.1, 'square', 0.07, 1500); tone(1400, 0.1, 'square', 0.06, 900, 0.11); },
    win: function () { [523, 659, 784, 1047, 784, 1047, 1319].forEach(function (f, i) { tone(f, 0.2, 'triangle', 0.22, 0, i * 0.14); }); }
  };

  /* ---------- read aloud ---------- */
  function pickVoice() {
    if (!('speechSynthesis' in W)) { return null; }
    var vs = speechSynthesis.getVoices() || [];

      { eq: '6 + 3', options: [8, 9, 10], answer: 9, hint: 'Start at 6 and count up 3 more: 7, 8, 9.' },
      { text: 'Tika has 5 bones. Zip gives her 3 more bones. How many bones does Tika have now?', options: [7, 8, 9], answer: 8, hint: 'Start at 5 and count up 3 more.' },
      { text: 'Which word means to put groups together?', options: ['add', 'run', 'roar'], answer: 'add', hint: 'It is the first math word we learned.' },
      { text: 'Rumbo roars 2 times. Then he roars 5 more times. How many roars in all?', options: [6, 7, 8], answer: 7, hint: 'Start at 5 and count up 2 more.' },
      { eq: '5 + 5', options: [9, 10, 11], answer: 10, hint: 'Use your fingers! 5 on one hand and 5 on the other.' }
    ] },

    { type: 'finish' }
  ]
};
</script>
<script>/* Lesson engine */
(function () {
  'use strict';
  var J = window.Jayven, L = window.LESSON, S = J.store;
  var stage = document.getElementById('stage'), bar = document.getElementById('pbar');
  var idx = 0, run = { correct: 0, total: 0 };

  function h(tag, cls, html) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (html != null) { e.innerHTML = html; } return e; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function numeric(list) { return list.every(function (v) { return /^-?\d+$/.test(String(v)); }); }
  function ordered(list) { return numeric(list) ? list.slice().sort(function (a, b) { return a - b; }) : shuffle(list); }
  function nearby(ans) { var c = [ans - 1, ans, ans + 1].filter(function (v) { return v >= 0; }); if (c.length < 3) { c.push(ans + 2); } return c; }
  var PLURAL = { egg: 'eggs', fish: 'fish', bone: 'bones', print: 'footprints' };
  function pl(icon) { return PLURAL[icon] || icon + 's'; }
  function itemsHTML(icon, n, cls) { var s = ''; for (var i = 0; i < n; i++) { s += '<button class="it ' + (cls || '') + '" aria-label="' + icon + '">' + J.item(icon) + '</button>'; } return s; }

  function chips() {
    var t = J.totals();
    document.getElementById('chipStars').innerHTML = J.item('star') + t.stars;
    document.getElementById('chipCoins').innerHTML = J.item('coin') + t.coins;
  }
  function syncBtns() {
    document.getElementById('btnSound').classList.toggle('off', !S.settings.sound);
    document.getElementById('btnAuto').classList.toggle('off', !S.settings.autoread);
  }
  document.getElementById('btnSound').onclick = function () { S.settings.sound = !S.settings.sound; J.save(); syncBtns(); if (S.settings.sound) { J.sfx.tap(); } };
  document.getElementById('btnAuto').onclick = function () { S.settings.autoread = !S.settings.autoread; J.save(); syncBtns(); if (S.settings.autoread) { J.say('Read to me is on.'); } };

  function setBar() { bar.style.width = Math.round(idx / (L.steps.length - 1) * 100) + '%'; }
  function go(n) { idx = n; render(); }
  function next() { go(idx + 1); }
  function render() {
    J.stop(); stage.innerHTML = ''; window.scrollTo(0, 0); setBar();
    var st = L.steps[idx];
    R[st.type](st);
    chips();
  }
  function readBtn(text, spans) {
    var b = h('button', 'btn alt', '🔊 Read to me');
    b.onclick = function () {
      J.sfx.tap();
      if (spans) {
        J.say(text, function (ci) {
          var cur = null;
          Array.prototype.forEach.call(spans, function (sp) { sp.classList.remove('hl'); if (+sp.getAttribute('data-s') <= ci) { cur = sp; } });
          if (cur) { cur.classList.add('hl'); }
        }, function () { Array.prototype.forEach.call(spans, function (sp) { sp.classList.remove('hl'); }); });
      } else { J.say(text); }
    };
    if (S.settings.autoread) { setTimeout(function () { b.click(); }, 450); }
    return b;
  }
  function tappable(p) {
    var spans = p.querySelectorAll('.w');
    Array.prototype.forEach.call(spans, function (sp) {
      sp.addEventListener('click', function () { J.say(sp.textContent); });
    });
    return spans;
  }
  function prompt(text) {
    var p = h('p', 'prompt', J.wordsHTML(text));
    return { el: p, spans: tappable(p) };
  }
  /* options: calls cb(true|false) */
  function options(parent, list, answer, cb) {
    var box = h('div', 'opts');
    ordered(list).forEach(function (v) {
      var s = String(v), b = h('button', 'opt' + (s.length > 3 ? ' txt' : ''), s);
      b.onclick = function () {
        if (b.disabled) { return; }
        if (s === String(answer)) {
          b.classList.add('good');
          Array.prototype.forEach.call(box.children, function (x) { x.disabled = true; });
          J.sfx.ok(); cb(true);
        } else { b.classList.add('bad'); b.disabled = true; J.sfx.no(); cb(false); }
      };
      box.appendChild(b);
    });
    parent.appendChild(box);
    return box;
  }
  function nextRow(card, label, fn) {
    var r = h('div', 'row');
    var b = h('button', 'btn pulse', label || 'Next ▶');
    b.onclick = function () { J.sfx.tap(); (fn || next)(); };
    r.appendChild(b); card.appendChild(r);
    setTimeout(function () { r.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }, 60);
  }
  var CHEERS = ['Great job!', 'Awesome!', 'You got it!', 'Super smart!', 'Roarsome!', 'Boom! Nailed it!'];
  function cheer() { return CHEERS[Math.floor(Math.random() * CHEERS.length)]; }

  var R = {};

  /* ---------- intro ---------- */
  R.intro = function (st) {
    var card = h('div', 'card');
    var sc = J.scene(st.scene, st.actors, { film: st.film });
    card.appendChild(sc);
    card.appendChild(h('h1', 'title', st.title));
    var p = prompt(st.goal); p.el.className += ' center'; card.appendChild(p.el);
    var r = h('div', 'row'); r.appendChild(readBtn(st.goal, p.spans)); card.appendChild(r);
    nextRow(card, "Let's go! ▶");
    stage.appendChild(card);
    if (st.fx === 'roar') { setTimeout(function () { J.sfx.roar(); sc.classList.add('shake'); }, 500); }
  };

  /* ---------- story ---------- */
  R.story = function (st) {
    var p = 0, card = h('div', 'card');
    stage.appendChild(card);
    function show() {
      card.innerHTML = ''; J.stop();
      var pg = st.pages[p];
      var sc = J.scene(pg.scene, pg.actors, { film: pg.film });
      card.appendChild(sc);
      if (pg.fx === 'roar') { setTimeout(function () { J.sfx.roar(); sc.classList.add('shake'); }, 400); }
      if (pg.fx === 'stomp') { setTimeout(function () { J.sfx.stomp(); sc.classList.add('shake'); }, 500); }
      var dots = h('div', 'dots'); st.pages.forEach(function (x, i) { dots.appendChild(h('i', i === p ? 'on' : '')); });
      card.appendChild(dots);
      var pr = prompt(pg.text); card.appendChild(pr.el);
      var r = h('div', 'row'); r.appendChild(readBtn(pg.text, pr.spans)); card.appendChild(r);
      var hint = h('p', 'center', '<small style="color:#6b7aa6">Tip: tap any word to hear it. Tap the monsters!</small>'); card.appendChild(hint);
      var nav = h('div', 'row');
      if (p > 0) { var bk = h('button', 'btn ghost', '◀ Back'); bk.onclick = function () { J.sfx.tap(); p--; show(); }; nav.appendChild(bk); }
      var nx = h('button', 'btn pulse', p < st.pages.length - 1 ? 'Next page ▶' : 'Continue ▶');
      nx.onclick = function () { J.sfx.tap(); if (p < st.pages.length - 1) { p++; show(); window.scrollTo(0, 0); } else { next(); } };
      nav.appendChild(nx); card.appendChild(nav);
    }
    show();
  };

  /* ---------- vocab ---------- */
  R.vocab = function (st) {
    var card = h('div', 'card');
    card.appendChild(h('h2', 'title', st.title || 'Math Words'));
    var intro = prompt(st.say || 'Tap each card to learn the word.'); card.appendChild(intro.el);
    var grid = h('div', 'vgrid'), opened = 0, nxt = null;
    st.words.forEach(function (w) {
      var c = h('button', 'vcard', '<div class="vw">' + w.w + '</div><div class="vh">tap to learn 🔊</div><div class="vm">' + w.m + '<br><b>' + w.ex + '</b></div>');
      c.onclick = function () {
        J.sfx.pop(opened);
        J.say(w.w + '. ' + (w.speak || w.m));
        if (!c.classList.contains('open')) {
          c.classList.add('open'); opened++;
          if (opened === st.words.length && !nxt) { nxt = true; nextRow(card); }
        }
      };
      grid.appendChild(c);
    });
    card.appendChild(grid); stage.appendChild(card);
  };

  /* ---------- tap to count & add ---------- */
  R.count = function (st) {
    var card = h('div', 'card');
    var sc = J.scene(st.scene || 'island', [
      { c: st.aChar || 'rex', x: 8, a: 'bob' }, { c: st.bChar || 'raptor', x: 36, a: 'hop', h: 44 }, { c: 'rumbo', x: 70, a: 'bob', h: 80, flip: true }
    ], { mini: true });
    card.appendChild(sc);
    var pr = prompt(st.say); card.appendChild(pr.el);
    var r = h('div', 'row'); r.appendChild(readBtn(st.say, pr.spans)); card.appendChild(r);
    var groups = h('div', 'groups');
    var gA = h('div', 'group', '<div class="gl">' + st.names[0] + '</div><div class="items">' + itemsHTML(st.icon, st.a) + '</div>');
    var gB = h('div', 'group', '<div class="gl">' + st.names[1] + '</div><div class="items">' + itemsHTML(st.icon, st.b) + '</div>');
    groups.appendChild(gA); groups.appendChild(h('div', 'sign', '+')); groups.appendChild(gB); card.appendChild(groups);
    var counter = h('div', 'counter', 'Tap every ' + st.icon + ' to count them: <b>0</b>'); card.appendChild(counter);
    var eq = h('div', 'eq hidden', st.a + ' + ' + st.b + ' = <span class="slot">?</span>'); card.appendChild(eq);
    var box = h('div', ''); card.appendChild(box);
    var fb = h('div', 'fb'); card.appendChild(fb);
    var total = st.a + st.b, n = 0, wrong = 0;
    Array.prototype.forEach.call(card.querySelectorAll('.it'), function (b) {
      b.onclick = function () {
        if (b.classList.contains('on')) { return; }
        b.classList.add('on'); n++;
        J.sfx.pop(n); J.say(String(n));
        counter.querySelector('b').textContent = n;
        if (n === total) {
          setTimeout(function () {
            eq.classList.remove('hidden'); counter.innerHTML = 'You counted <b>' + n + '</b> in all!';
            fb.textContent = 'Now pick the answer:';
            options(box, nearby(total), total, function (ok) {
              if (ok) {
                eq.classList.add('good'); eq.querySelector('.slot').textContent = total;
                fb.className = 'fb good'; fb.textContent = cheer() + ' ' + st.a + ' plus ' + st.b + ' equals ' + total + '.';
                J.say(st.a + ' plus ' + st.b + ' equals ' + total);
                nextRow(card);
              } else { wrong++; fb.className = 'fb bad'; fb.textContent = 'Not yet! Look at the ' + pl(st.icon) + ' and count again.'; }
            });
          }, 500);
        }
      };
    });
    stage.appendChild(card);
  };

  /* ---------- number line hops ---------- */
  R.hop = function (st) {
    var back = st.dir === 'back', card = h('div', 'card');
    card.appendChild(h('h2', 'title', st.title || 'Number Line Hop'));
    var pr = prompt(st.say); card.appendChild(pr.el);
    var r = h('div', 'row'); r.appendChild(readBtn(st.say, pr.spans)); card.appendChild(r);
    var max = st.max, nl = h('div', 'nl'), cells = h('div', 'cells'), pos = st.start, hops = 0, i;
    for (i = 0; i <= max; i++) { cells.appendChild(h('div', 'cell' + (i === st.start ? ' start here' : ''), String(i))); }
    var hopper = h('div', 'hopper'), hj = h('div', 'hj');
    var ch = h('div', ''); ch.innerHTML = J.CHARS.raptor; hj.appendChild(ch.firstChild); hopper.appendChild(hj);
    nl.appendChild(hopper); nl.appendChild(cells); card.appendChild(nl);
    function place() { hopper.style.left = ((pos + 0.5) / (max + 1) * 100) + '%'; }
    place();
    var info = h('div', 'counter', 'Hops: <b>0</b> of ' + st.hops); card.appendChild(info);
    var btnRow = h('div', 'row'), hb = h('button', 'btn pulse', back ? '◀ Hop back!' : 'Hop! ▶');
    btnRow.appendChild(hb); card.appendChild(btnRow);
    var q = h('div', 'hidden'); card.appendChild(q);
    var fb = h('div', 'fb'); card.appendChild(fb);
    hb.onclick = function () {
      if (hops >= st.hops) { return; }
      hops++; pos += back ? -1 : 1;
      place(); J.sfx.hop(); J.say(String(hops));
      hj.classList.remove('j'); void hj.offsetWidth; hj.classList.add('j');
      var cs = cells.children; Array.prototype.forEach.call(cs, function (c) { c.classList.remove('here'); });
      cs[pos].classList.add('vis'); cs[pos].classList.add('here');
      info.innerHTML = 'Hops: <b>' + hops + '</b> of ' + st.hops;
      if (hops === st.hops) {
        hb.disabled = true; hb.classList.remove('pulse');
        setTimeout(function () {
          q.className = ''; q.appendChild(h('p', 'prompt center', 'Where did Zip land?'));
          options(q, nearby(pos), pos, function (ok) {
            if (ok) {
              fb.className = 'fb good';
              fb.textContent = cheer() + ' ' + st.start + (back ? ' minus ' : ' plus ') + st.hops + ' equals ' + pos + '.';
              J.say(st.start + (back ? ' minus ' : ' plus ') + st.hops + ' equals ' + pos);
              nextRow(card);
            } else { fb.className = 'fb bad'; fb.textContent = 'Look at the number where Zip is standing!'; }
          });
        }, 500);
      }
    };
    stage.appendChild(card);
  };

  /* ---------- take away (tap to remove) ---------- */
  R.takeaway = function (st) {
    var card = h('div', 'card');
    var sc = J.scene(st.scene || 'harbor', [{ c: st.char || 'rex', x: 6, a: 'bob' }, { c: 'rumbo', x: 72, a: 'bob', h: 80, flip: true }], { mini: true });
    card.appendChild(sc);
    var pr = prompt(st.say); card.appendChild(pr.el);
    var r = h('div', 'row'); r.appendChild(readBtn(st.say, pr.spans)); card.appendChild(r);
    var groups = h('div', 'groups');
    var g = h('div', 'group', '<div class="gl">' + st.label + '</div><div class="items">' + itemsHTML(st.icon, st.a) + '</div>');
    groups.appendChild(g); card.appendChild(groups);
    var counter = h('div', 'counter', 'Taken away: <b>0</b> of ' + st.b); card.appendChild(counter);
    var eq = h('div', 'eq hidden', st.a + ' − ' + st.b + ' = <span class="slot">?</span>'); card.appendChild(eq);
    var box = h('div', ''); card.appendChild(box);
    var fb = h('div', 'fb'); card.appendChild(fb);
    var removed = 0, left = st.a - st.b;
    Array.prototype.forEach.call(g.querySelectorAll('.it'), function (b) {
      b.onclick = function () {
        if (removed >= st.b || b.classList.contains('gone')) { return; }
        removed++; b.classList.add('gone'); J.sfx.pop(removed); setTimeout(function () { b.style.display = 'none'; }, 380);
        counter.querySelector('b').textContent = removed;
        if (removed === st.b) {
          setTimeout(function () {
            eq.classList.remove('hidden');
            counter.innerHTML = 'How many ' + pl(st.icon) + ' are <b>left</b>? Count them!';
            var rem = g.querySelectorAll('.it:not(.gone)'), k = 0;
            Array.prototype.forEach.call(rem, function (x) { x.classList.add('on'); x.onclick = function () { if (x.dataset.c) { return; } x.dataset.c = 1; k++; J.sfx.pop(k); J.say(String(k)); }; });
            options(box, nearby(left), left, function (ok) {
              if (ok) {
                eq.classList.add('good'); eq.querySelector('.slot').textContent = left;
                fb.className = 'fb good'; fb.textContent = cheer() + ' ' + st.a + ' minus ' + st.b + ' equals ' + left + '.';
                J.say(st.a + ' minus ' + st.b + ' equals ' + left);
                nextRow(card);
              } else { fb.className = 'fb bad'; fb.textContent = 'Tap the ones that are left and count them.'; }
            });
          }, 500);
        }
      };
    });
    stage.appendChild(card);
  };

  /* ---------- word problem (reading + math) ---------- */
  R.problem = function (st) {
    var card = h('div', 'card');
    card.appendChild(h('h2', 'title', st.title || 'Story Problem'));
    if (st.scene) { card.appendChild(J.scene(st.scene, st.actors, { mini: true })); }
    var pr = prompt(st.text); card.appendChild(pr.el);
    var r = h('div', 'row'); r.appendChild(readBtn(st.text, pr.spans)); card.appendChild(r);
    if (st.pic) { card.appendChild(picEl(st.pic)); }
    var fb = h('div', 'fb'); var box = h('div', ''); card.appendChild(box); card.appendChild(fb);
    options(box, st.options, st.answer, function (ok) {
      if (ok) { fb.className = 'fb good'; fb.textContent = cheer() + ' ' + (st.explain || ''); if (st.explain) { J.say(st.explain); } nextRow(card); }
      else { fb.className = 'fb bad'; fb.textContent = st.hint || 'Read it again slowly and try again!'; }
    });
    stage.appendChild(card);
  };

  function picEl(p) {
    var d = h('div', 'qpic');
    var a = h('div', 'grp', itemsHTML(p.icon, p.a));
    d.appendChild(a);
    if (p.op === '+') { d.appendChild(h('div', 'sign', '+')); d.appendChild(h('div', 'grp', itemsHTML(p.icon, p.b))); }
    else { var kids = a.querySelectorAll('.it'); for (var i = kids.length - p.b; i < kids.length; i++) { kids[i].classList.add('xed'); } }
    return d;
  }

  /* ---------- quiz ---------- */
  R.quiz = function (st) {
    var q = 0, qs = st.questions;
    run.total = qs.length; run.correct = 0;
    var card = h('div', 'card'); stage.appendChild(card);
    function show() {
      card.innerHTML = ''; J.stop();
      var Q = qs[q], tries = 0;
      card.appendChild(h('div', 'qhead', '<span>🎯 Quiz Time!</span><span>Question ' + (q + 1) + ' of ' + qs.length + '</span>'));
      var spoken = Q.text || Q.eq || '';
      if (Q.text) { var pr = prompt(Q.text); card.appendChild(pr.el); card.appendChild(rowOf(readBtn(Q.text, pr.spans))); }
      if (Q.eq) { card.appendChild(h('div', 'eq', Q.eq + ' = <span class="slot">?</span>')); card.appendChild(rowOf(readBtn(Q.eq.replace('−', ' minus ') + ' equals what?'))); }
      if (Q.pic) { card.appendChild(picEl(Q.pic)); }
      var box = h('div', ''), fb = h('div', 'fb'); card.appendChild(box); card.appendChild(fb);
      options(box, Q.options, Q.answer, function (ok) {
        if (ok) {
          if (tries === 0) { run.correct++; J.sfx.coin(); }
          fb.className = 'fb good'; fb.textContent = cheer() + (tries === 0 ? ' +1 point!' : '');
          nextRow(card, q < qs.length - 1 ? 'Next question ▶' : 'Finish! ▶', function () { if (q < qs.length - 1) { q++; show(); window.scrollTo(0, 0); } else { next(); } });
        } else { tries++; fb.className = 'fb bad'; fb.textContent = (Q.hint || 'Try again!') + ' (Pick another answer)'; }
      });
    }
    function rowOf(el) { var r = h('div', 'row'); r.appendChild(el); return r; }
    show();
  };

  /* ---------- finish ---------- */
  R.finish = function () {
    var total = run.total || 1, c = run.correct, pct = c / total;
    var stars = pct >= 0.8 ? 3 : pct >= 0.5 ? 2 : 1, coins = c + stars;
    var rec = S.lessons[L.id] || (S.lessons[L.id] = { stars: 0, bestScore: 0, bestCoins: 0, plays: 0, total: total });
    var gain = Math.max(0, coins - (rec.bestCoins || 0));
    rec.plays = (rec.plays || 0) + 1; rec.stars = Math.max(rec.stars || 0, stars);
    rec.bestScore = Math.max(rec.bestScore || 0, c); rec.bestCoins = Math.max(rec.bestCoins || 0, coins); rec.total = total;
    J.save(); chips();
    var card = h('div', 'card center');
    card.appendChild(J.scene('island', [
      { c: 'rex', x: 6, a: 'hop' }, { c: 'raptor', x: 34, a: 'hop', h: 44 }, { c: 'rumbo', x: 70, a: 'bob', h: 84, flip: true }
    ], { mini: true }));
    card.appendChild(h('h1', 'title', stars === 3 ? 'Amazing, Jayven!' : stars === 2 ? 'Great work, Jayven!' : 'Good try, Jayven!'));
    var sh = ''; for (var i = 1; i <= 3; i++) { sh += '<span>' + J.item(i <= stars ? 'star' : 'starOff') + '</span>'; }
    card.appendChild(h('div', 'stars', sh));
    card.appendChild(h('p', 'sub', 'You got <b>' + c + ' of ' + total + '</b> right on the first try!' + (stars < 3 ? '<br>Play again to earn more stars!' : '')));
    card.appendChild(h('div', 'earn', J.item('coin') + (gain > 0 ? '+' + gain + ' Sats added to your bank!' : 'Beat your best score to earn more Sats!')));
    var r = h('div', 'row');
    var home = h('a', 'btn alt', '🏠 Home'); home.href = 'index.html'; home.style.textDecoration = 'none';
    var again = h('button', 'btn ghost', '↻ Try again'); again.onclick = function () { go(0); };
    r.appendChild(home); r.appendChild(again);
    if (L.nextFile) { var nx = h('a', 'btn pulse', 'Next lesson ▶'); nx.href = L.nextFile; nx.style.textDecoration = 'none'; r.appendChild(nx); }
    card.appendChild(r);
    stage.appendChild(card);
    J.sfx.win(); J.coinRain(document.body, 20 + coins * 2);
    setTimeout(function () { J.sfx.roar(); }, 900);
    J.say(stars === 3 ? 'Amazing, Jayven! You earned three stars!' : 'Great work, Jayven! You earned ' + stars + (stars === 1 ? ' star!' : ' stars!'));
  };

  document.getElementById('lessonTitle').textContent = L.short;
  J.goStep = go;
  syncBtns(); render();
})();
</script>
